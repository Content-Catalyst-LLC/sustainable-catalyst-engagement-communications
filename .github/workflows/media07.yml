name: MEDIA-07 newsletter delivery foundation
on:
  push:
    branches:
      - feature/media-07-listmonk-delivery-foundation-20261108
  pull_request:
    paths:
      - 'deploy/media07/**'
      - 'backend/app/media07_delivery_v1270.py'
      - 'backend/app/media07_listmonk_draft_v1280.py'
      - 'backend/app/media07_studio_bridge_v1290.py'
      - 'backend/tests/test_media07_delivery_v1270.py'
      - 'backend/tests/test_media07_listmonk_draft_v1280.py'
      - 'backend/tests/test_media07_studio_bridge_v1290.py'
      - 'backend/tests/test_media07_live_canary_runner.py'
      - 'backend/app/main.py'
      - '.github/workflows/media07.yml'
permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned requirements
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check interactive secret-file provisioner syntax
        run: |
          python -m py_compile deploy/media07/provision-draft-credential.py
          python -m py_compile deploy/media07/accept-live-draft-canary.py
      - name: MEDIA-07 no-dispatch tests and MEDIA-06 regression
        working-directory: backend
        run: python -m pytest -q tests/test_media07_delivery_v1270.py tests/test_media07_listmonk_draft_v1280.py tests/test_media07_studio_bridge_v1290.py tests/test_media07_live_canary_runner.py tests/test_media_operations_v1260.py
      - name: Check isolated Compose configuration
        env:
          MEDIA07_DB_PASSWORD: ci_not_a_secret
          MEDIA07_ADMIN_USER: ci_admin
          MEDIA07_ADMIN_PASSWORD: ci_not_a_secret
        run: |
          docker compose -f deploy/media07/compose.staging.yml config --quiet
          docker compose -f deploy/media07/compose.staging.yml config --format json > /tmp/media07-compose-validated.json
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('/tmp/media07-compose-validated.json').read_text())
          services=cfg['services']
          assert set(services)=={'db','listmonk','mailpit','admin_proxy'}
          assert cfg['networks']['media07_private']['internal'] is True
          assert all('ports' not in services[x] for x in ('db','listmonk','mailpit'))
          assert len(services['admin_proxy']['ports']) == 2
          for service in services.values():
              assert all(p.get('host_ip')=='127.0.0.1' for p in service.get('ports',[]))
          assert not any('smtp' in key.lower() for key in services['listmonk'].get('environment',{})
                         if 'provider' in key.lower())
          print('MEDIA-07 LOCAL-ONLY COMPOSE: PASS')
          PY


  isolated-staging-smoke:
    runs-on: ubuntu-latest
    env:
      MEDIA07_DB_PASSWORD: ephemeral_ci_db_only
      MEDIA07_ADMIN_USER: ephemeral_ci_admin
      MEDIA07_ADMIN_PASSWORD: ephemeral_ci_admin_only
    steps:
      - uses: actions/checkout@v4
      - name: Launch local-only disposable listmonk and Mailpit
        run: |
          set -euo pipefail
          docker compose -f deploy/media07/compose.staging.yml up -d
          docker compose -f deploy/media07/compose.staging.yml ps
      - name: Exercise local HTTP services
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1:18898/ || true)
            if [[ "$code" == 200 || "$code" == 302 || "$code" == 303 || "$code" == 401 ]]; then
              ok=1; break
            fi
            sleep 3
          done
          if [[ "$ok" != 1 ]]; then
            echo "listmonk HTTP unavailable (no external send attempted)"
            docker compose -f deploy/media07/compose.staging.yml ps
            exit 1
          fi
          curl -fsS --retry 10 --retry-delay 2 http://127.0.0.1:18899/api/v1/messages >/tmp/media07-emptymail.json
          echo "Isolated listmonk and Mailpit HTTP checks: PASS"
      - name: SMTP capture only with synthetic invalid recipient
        run: |
          set -euo pipefail
          docker run --rm -i --network sc-media07-staging_media07_private python:3.12-alpine python - <<'PY'
          from email.message import EmailMessage
          from smtplib import SMTP
          msg=EmailMessage()
          msg['From']='fixture@sender.invalid'
          msg['To']='fixture@recipient.invalid'
          msg['Subject']='MEDIA07 isolated synthetic capture'
          msg.set_content('Captured locally; never an external send.')
          with SMTP('mailpit',1025,timeout=15) as smtp:
              smtp.send_message(msg)
          print('Message captured by private test transport.')
          PY
          curl -fsS http://127.0.0.1:18899/api/v1/messages >/tmp/media07-mail.json
          python - <<'PY'
          import json
          from pathlib import Path
          inbox=json.loads(Path('/tmp/media07-mail.json').read_text())
          assert inbox['total']>0
          assert any('MEDIA07 isolated synthetic capture' in item.get('Subject','')
                     for item in inbox.get('messages', []))
          print('Mailpit synthetic capture PASS; no external recipient.')
          PY
      - name: Dispose CI-only staging volumes
        if: always()
        run: docker compose -f deploy/media07/compose.staging.yml down -v --remove-orphans
