name: Media backend integration verification
on:
  push:
    branches:
      - feature/media-06-operational-integration-20261108
  pull_request:
    paths:
      - 'backend/app/media_operations_v1260.py'
      - 'backend/tests/test_media_operations_v1260.py'
      - 'backend/app/main.py'
      - 'backend/app/media09*'
      - 'backend/app/persistence/media09*'
      - 'backend/tests/test_media09_privacy*'
      - 'backend/app/hubspot.py'
      - 'backend/app/human_auth.py'
      - 'backend/app/persistence/media09.py'
      - 'backend/alembic/**'
      - 'backend/tests/test_media09*'
      - 'backend/tests/test_hubspot.py'
      - 'tools/verify_media09_postgres.py'
      - 'wordpress-bridge/sustainable-catalyst-engagement-communications/includes/media06-operations.php'
      - 'wordpress-bridge/sustainable-catalyst-engagement-communications/sustainable-catalyst-engagement-communications.php'
      - '.github/workflows/media06.yml'
      - 'backend/migrations/MEDIA06_CREATE.sql'
permissions:
  contents: read
jobs:
  offline-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend test requirements
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run complete backend regression including Media Press and HubSpot
        working-directory: backend
        run: python -m pytest -q tests
      - name: PHP syntax checks
        run: |
          php -l wordpress-bridge/sustainable-catalyst-engagement-communications/includes/media06-operations.php
          php -l wordpress-bridge/sustainable-catalyst-engagement-communications/sustainable-catalyst-engagement-communications.php

  database-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scec_engagement_media06_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: media06_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scec_engagement_media06_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: scec_engagement_media06_ci
      PGUSER: postgres
      PGPASSWORD: media06_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Use PostgreSQL 16 clients from the existing service
        env:
          PG_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python - <<'PYCLIENT'
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('PG_SERVICE_CONTAINER='+os.environ['PG_SERVICE_CONTAINER']+'\n')
          root=Path(os.environ['RUNNER_TEMP'])/'media09-pg16-bin'
          root.mkdir()
          for name in ('psql','createdb','pg_dump','pg_restore'):
              path=root/name
              path.write_text('#!/bin/sh\nexec python "$GITHUB_WORKSPACE/tools/ci_postgres_client.py" '+name+' "$@"\n')
              path.chmod(0o755)
          with open(os.environ['GITHUB_PATH'],'a') as out:out.write(str(root)+'\n')
          PYCLIENT
          docker exec "$PG_SERVICE_CONTAINER" pg_dump --version
          docker exec "$PG_SERVICE_CONTAINER" pg_restore --version
      - name: Apply actual MEDIA-06 migration to disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f backend/migrations/MEDIA06_CREATE.sql
      - name: Check three tables and immutable evidence triggers
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $media06_ci$
          DECLARE
            count_tables integer;
            count_triggers integer;
          BEGIN
            SELECT count(*) INTO count_tables
            FROM information_schema.tables
            WHERE table_schema='public'
              AND table_name IN ('media06_packages','media06_reviews','media06_audit');
            IF count_tables <> 3 THEN
              RAISE EXCEPTION 'MEDIA-06 migration missing tables';
            END IF;
            SELECT count(*) INTO count_triggers
            FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid
            WHERE c.relname IN ('media06_reviews','media06_audit')
              AND t.tgname IN ('media06_reviews_immutable','media06_audit_immutable')
              AND NOT t.tgisinternal;
            IF count_triggers <> 2 THEN
              RAISE EXCEPTION 'MEDIA-06 audit immutability triggers missing';
            END IF;
          END; $media06_ci$;
          SQL
      - name: Confirm unsafe database name fails without schema changes
        run: |
          if PGDATABASE=postgres psql -X -v ON_ERROR_STOP=1 -f backend/migrations/MEDIA06_CREATE.sql >/dev/null 2>&1; then
            echo 'Unsafe database guard failed'
            exit 1
          fi
          if [ "$(PGDATABASE=postgres psql -X -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'media06_%'")" != 0 ]; then
            echo 'Unsafe database was changed'
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Media PostgreSQL acceptance dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run real synthetic Media Press PostgreSQL acceptance
        env:
          SCEC_DATABASE_URL: postgresql+psycopg://postgres:media06_ci_only@127.0.0.1:5432/scec_engagement_media09_acceptance
          SCEC_ENV: development
          SCEC_IDENTITY_MODE: bound
          SCEC_AUTH_MODE: token
          SCEC_IDENTITY_SIGNING_KEY: synthetic-ci-signing-key-never-production-123456789
          SCEC_PERSISTENCE_ENABLED: '1'
          SCEC_MEDIA09_PRESS_STAGING_ENABLED: '1'
          SCEC_MEDIA09_WEB_STAGING_ENABLED: '1'
          SCEC_ALLOWED_ORGANIZATION_IDS: 00000000-0000-0000-0000-000000000001
        run: |
          createdb scec_engagement_media09_acceptance
          (cd backend && PYTHONPATH=. python -m alembic upgrade head)
          MEDIA09_SOURCE_SHA="$GITHUB_SHA" MEDIA09_RECEIPT="$RUNNER_TEMP/media09-postgres.json" PYTHONPATH=backend python tools/verify_media09_postgres.py
          MEDIA09_PRIVACY_TEST_DATABASE_URL="$SCEC_DATABASE_URL" PYTHONPATH=backend python -m pytest -q backend/tests/test_media09_privacy_pg.py
