services:
  engagement-web:
    build: .
    container_name: scec-engagement-web-v870
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
