server { listen 80; server_name _; root /usr/share/nginx/html; index index.html; autoindex off; server_tokens off; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header X-Frame-Options DENY always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always; location = /healthz { default_type text/plain; return 200 'ok'; } location = /v1 { default_type application/json; return 503 '{"status":"unavailable","reason":"api_activation_pending"}'; } location ^~ /v1/ { default_type application/json; return 503 '{"status":"unavailable","reason":"api_activation_pending"}'; } location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=3600"; } location / { try_files $uri /index.html; add_header Cache-Control "no-store"; } }